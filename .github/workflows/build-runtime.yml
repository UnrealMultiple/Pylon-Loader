# 运行时 pin 回归门：跑 fetch-dotnet-runtime.ps1 验证 pin 与包完整性。
name: build-runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/csharp/tools/fetch-dotnet-runtime.ps1'
      - 'src/csharp/tools/dotnet-runtime.env'
      - '.github/workflows/build-runtime.yml'

permissions:
  contents: read

jobs:
  runtime-pin:
    name: dotnet 运行时 pin 门（nuget.org）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 校验运行时 pin
        run: pwsh -NoProfile -File src/csharp/tools/fetch-dotnet-runtime.ps1 -Force -RuntimeRoot "$RUNNER_TEMP/pylon-runtime"

      - name: 记录清单
        run: |
          ls "$RUNNER_TEMP/pylon-runtime/lib"
          ls "$RUNNER_TEMP/pylon-runtime/dotnet" | head -12
