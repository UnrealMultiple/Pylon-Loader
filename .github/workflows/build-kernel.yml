# 层：CI —— 交叉编译内核 libpylon.so
#
# 内核不依赖任何游戏文件（全部按名字 dlsym），所以可以在 CI 上产出。
# src/core/build.ps1 已按宿主自动选 toolchains/llvm/prebuilt/<host>/bin（Windows / Linux / macOS），
# 因此这份脚本在 Ubuntu runner 上直接跑。
#
# 拿到的 artifact 放这里：src/app/src/main/jniLibs/arm64-v8a/libpylon.so
name: build-kernel

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/core/**'
      - '.github/workflows/build-kernel.yml'

permissions:
  contents: read

jobs:
  libpylon:
    name: libpylon.so (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ubuntu runner 自带 Android commandline-tools；NDK 版本与本地开发一致
      - name: 安装 NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.1.12297006"

      - name: 编译内核（NDK clang++，不经 CMake）
        run: pwsh -NoProfile -File src/core/build.ps1 -Ndk "$ANDROID_HOME/ndk/27.1.12297006"

      - name: 记录导出符号
        run: |
          READELF="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" --dyn-syms --wide src/app/src/main/jniLibs/arm64-v8a/libpylon.so | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: libpylon
          path: src/app/src/main/jniLibs/arm64-v8a/libpylon.so
          if-no-files-found: error