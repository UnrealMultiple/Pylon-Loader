# 交叉编译内核 libpylon.so（shadowhook 子模块源码静态内嵌）。
name: build-kernel

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/core/**'
      - 'external/shadowhook/**'
      - '.github/workflows/build-kernel.yml'

permissions:
  contents: read

jobs:
  libpylon:
    name: libpylon.so (arm64-v8a, shadowhook 内嵌)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu runner 自带 Android commandline-tools；NDK 版本与本地开发一致
      - name: 安装 NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.1.12297006"

      - name: 编译内核（NDK clang++，不经 CMake）
        run: pwsh -NoProfile -File src/core/build.ps1 -Ndk "$ANDROID_HOME/ndk/27.1.12297006"

      - name: 记录导出符号
        run: |
          READELF="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" --dyn-syms --wide src/app/src/main/jniLibs/arm64-v8a/libpylon.so | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: libpylon
          path: src/app/src/main/jniLibs/arm64-v8a/libpylon.so
          if-no-files-found: error