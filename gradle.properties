# Pylon Loader — 全局 Gradle 设置（层：构建工程）

# 构建缓存收进工作区：本机沙箱不允许写 C:\Users\admin\.gradle，收进来后不碰用户主目录。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.8.0 官方只测到 compileSdk 35；本机只有 android-36 platform，且设备是 API 37。
# 显式压制该警告，避免被当成构建噪音（不改 minSdk/targetSdk 语义）。
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official

# Kotlin 编译放 Gradle 进程内：本机沙箱起不了 Kotlin 守护进程（"Couldn't open current thread, error = 5"）。
kotlin.compiler.execution.strategy=in-process
